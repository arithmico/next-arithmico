name: Cleanup Pull Request
on:
  pull_request:
    types: [closed]

permissions:
  id-token: write
  contents: read

jobs:
  remove-review-artifact:
    name: Delete Review Artifact
    runs-on: ubuntu-latest
    steps:
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        role-to-assume: ${{ secrets.CDK_ROLE_ARN }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ vars.AWS_REGION }}

    - name: Delete Artifact
      shell: bash
      env:
        BUCKET_NAME: ${{ vars.ARTIFACTS_BUCKET_NAME }}
        PR_NUMBER: ${{ github.event.number }}
      run:
        ARTIFACT="review-$PR_NUMBER";
        DEST_PATH="s3://$BUCKET_NAME/calculator/$ARTIFACT";
        aws s3 rm $DEST_PATH --recursive;
