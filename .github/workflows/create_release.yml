name: Create Release
on:
  push:
    branches: 
      - main

concurrency:
  group: staging-environment

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.create-tag.outputs.version_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install create_version
        shell: bash
        run: cargo install --path packages/applications/create_version
      - name: Create and push tag
        id: create-tag
        shell: bash
        env: 
          SEMVER_PRERELEASE: ${{ vars.SEMVER_PRERELEASE }}
        run: |
          VERSION_TAG=$(create_version)
          git tag $VERSION_TAG
          git push origin $VERSION_TAG
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"
  
  build-and-deploy-calculator:
    name: Build And Deploy Calculator
    runs-on: ubuntu-24.04
    needs: create-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@main
      - name: Setup toolchain
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          cargo binstall -y --locked trunk
          cargo install cssbundler --path packages/applications/cssbundler
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@6.2.2
        with:
          role-to-assume: ${{ secrets.CDK_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: build calculator
        working-directory: packages/applications/arithmico
        shell: bash
        env:
          APP_VERSION: ${{ needs.create-release.outputs.version_tag }}
        run: |
          touch index.css 
          ~/.cargo/bin/trunk build --release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install NPM Dependencies
        run: npm ci
      - name: CDK Deploy
        working-directory: infrastructure
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CDK_DEPLOY_ARTIFACT: ${{ needs.create-release.outputs.version_tag }}
          CDK_DEPLOY_ENVIRONMENT: ${{ github.ref_name }}
        run: npm run cdk -- deploy --all --require-approval never
