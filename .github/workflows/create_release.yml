name: Create Release
on:
  push:
    branches: 
      - main

permissions:
  contents: write
  id-token: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install create_version
        shell: bash
        run: cargo install --path packages/applications/create_version
      - name: Create and push tag
        shell: bash
        env: 
          SEMVER_PRERELEASE: ${{ vars.SEMVER_PRERELEASE }}
        run: |
          VERSION_TAG=$(create_version)
          git tag $VERSION_TAG
          git push origin $VERSION_TAG
  
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4.3.1
        with:
          role-to-assume: ${{ secrets.CDK_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ vars.AWS_REGION }}
      - name: CDK Deploy
        working-directory: infrastructure
        shell: bash
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          npm ci
          npm run cdk -- deploy
