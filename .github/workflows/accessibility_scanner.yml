name: Accessibility Scanner

on:
  push:
    branches: 
      - main

jobs:
  accessibility-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: github/accessibility-scanner@v3
        with:
          urls: |
            https://next.arithmico.com/
            https://next.arithmico.com/settings
            https://next.arithmico.com/reference
            https://next.arithmico.com/about
          repository: arithmico/next-arithmico
          token: ${{ secrets.GH_TOKEN }}
          cache_key: next.arithmico.com/sbom.json
