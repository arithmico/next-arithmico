name: Check Pull Request
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo test --all-features
        shell: bash

  test-e2e:
    name: Run E2E Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v2
    - uses: cargo-bins/cargo-binstall@main
    - name: Setup toolchain
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        cargo binstall -y --locked --force trunk@0.22.0
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - name: Install NPM Dependencies
      run: npm ci
    - name: Install Playwright
      run: npx playwright install --with-deps
    
    - name: Launch Web Server
      working-directory: packages/applications/arithmico
      shell: bash
      run: |
        touch index.css 
        ~/.cargo/bin/trunk build --release
        ~/.cargo/bin/trunk serve --watch "." --release > /dev/null 2>&1 &
        npm i -g wait-on@9.5.1
        npx --no wait-on http://localhost:8080 --timeout 120000

    - name: Run E2E Tests
      working-directory: packages/applications/arithmico-e2e
      run: npx playwright test

  build-and-deploy:
    name: Build And Deploy Review Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: review-environment-${{ github.event.number }}
    steps:
    - uses: actions/checkout@v7
    - uses: mlugg/setup-zig@v2
    - uses: actions-rust-lang/setup-rust-toolchain@v2
    - uses: cargo-bins/cargo-binstall@main
    - name: Setup toolchain
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        cargo binstall -y --locked --force trunk@0.22.0 cargo-lambda@=1.9.2
    - name: Build Artifact
      working-directory: packages/applications/arithmico
      shell: bash
      env:
        APP_VERSION: review-${{ github.event.number }}
      run: |
        touch index.css 
        ~/.cargo/bin/trunk build --release
    - name: Generate SBOM
      run: |
        cargo binstall -y --locked --force cargo-cyclonedx
        cargo cyclonedx --format json --override-filename sbom
        cp packages/applications/arithmico/sbom.json packages/applications/arithmico/dist/sbom.json
    - name: configure aws credentials
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ secrets.CDK_ROLE_ARN }}
        role-session-name: GitHub_to_AWS_via_FederatedOIDC
        aws-region: ${{ vars.AWS_REGION }}
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - name: Install NPM Dependencies
      run: npm ci
    - name: CDK Deploy
      working-directory: infrastructure
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        CDK_DEPLOY_ARTIFACT: review-${{ github.event.number }}
        CDK_DEPLOY_ENVIRONMENT: review-${{ github.event.number }}
      run: npm run cdk -- deploy --all --require-approval never
    - name: CDK Diff
      id: cdk-diff
      working-directory: infrastructure
      env:
        AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        AWS_REGION: ${{ vars.AWS_REGION }}
        CDK_DEPLOY_ARTIFACT: review-${{ github.event.number }}
        CDK_DEPLOY_ENVIRONMENT: main
      run: |
        npm run cdk -- synth
        RAW_DIFF=$(npx --no cdk diff --quiet --ci --no-color 2>/dev/null)
        EXIT_CODE=$?
        DIFF_OUTPUT=$(echo "$RAW_DIFF" \
          | sed -E "s/${{ secrets.AWS_ACCOUNT_ID }}/****/g" \
          | grep -vE "^(start:|success:|Hold on while|Building |Publishing )")
        echo "diff<<EOF" >> $GITHUB_OUTPUT
        echo "$DIFF_OUTPUT" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::CDK diff execution failed with code $EXIT_CODE. $DIFF_OUTPUT"
          exit $EXIT_CODE
        fi
    - name: Find Comment
      uses: peter-evans/find-comment@v4
      id: fc
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '<!-- review-deployment-url-comment-marker -->'
    - name: Create or Update Comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        edit-mode: replace
        body: |
          <!-- review-deployment-url-comment-marker -->
          **Review deployment created**: Click [here](https://review-${{ github.event.pull_request.number }}.calculator.arithmico.com`)

          <details>
            <summary>Infrastructure Diff</summary>
          
          ```diff
          ${{ steps.cdk-diff.outputs.diff }}
          ```

          </details>


  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
      - name: Install leptosfmt
        run: cargo install leptosfmt
      - name: Format check
        run: leptosfmt --check .

  lint:
    name: Check Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-Dwarnings" # Make sure CI fails on all warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

  validate-feature-configuration:
    name: Validate Feature Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v2
    - uses: cargo-bins/cargo-binstall@main
    - name: Install Feature Manager
      shell: bash
      run: cargo install --path packages/applications/feature-manager
    - name: Validate Feature Configuration
      shell: bash
      run: feature-manager verify
