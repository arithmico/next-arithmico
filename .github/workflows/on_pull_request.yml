name: "Check Pull Request"
on:
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo test --all-features
        shell: bash
  
  test-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: cargo-bins/cargo-binstall@main
    - shell: bash
      run: |
        cargo binstall -y --force trunk
        rustup target add wasm32-unknown-unknown
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: setup e2e tests
      working-directory: packages/applications/arithmico-e2e
      run: | 
        npm ci
        npx playwright install --with-deps

    - name: install tailwind cli
      run: npm i -g tailwindcss@3 postcss autoprefixer
    
    - name: prebuild app
      working-directory: packages/applications/arithmico
      shell: bash
      run: ~/.cargo/bin/trunk build
    
    - name: setup e2e tests
      working-directory: packages/applications/arithmico-e2e
      run: | 
        npx playwright test

  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1