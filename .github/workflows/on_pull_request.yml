name: "Check Pull Request"
on:
  pull_request:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo test --all-features
        shell: bash

  test-e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - uses: cargo-bins/cargo-binstall@main
    - shell: bash
      run: .github/workflows/setup.sh
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: setup e2e tests
      working-directory: packages/applications/arithmico-e2e
      run: |
        npm ci
        npx playwright install --with-deps
    
    - name: prebuild app
      working-directory: packages/applications/arithmico
      shell: bash
      run: |
        touch index.css 
        ~/.cargo/bin/trunk build
    
    - name: setup e2e tests
      working-directory: packages/applications/arithmico-e2e
      run: npx playwright test

  test-infrastructure:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: test cdk
      working-directory: infrastructure
      run: |
        npm ci
        npm run cdk -- synth -q

  formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Install leptosfmt
        run: cargo install leptosfmt
      - name: Format check
        run: leptosfmt --check .
