[package]
name = "editor"
version = "0.1.0"
edition = "2021"

[dependencies]
editor_core = { path = "../editor_core" }
leptos = { workspace = true }
leptos_dom = { version = "0.6.15", features = ["csr", "web"] }
unicode-segmentation = "1.12.0"
web-sys = { version = "0.3.72", features = ["Document", "Element", "Selection", "DataTransfer"] }
