# nintegrate
[engine.api.error.generic_runtime_error.nintegrate.invalid_tolerance]
English = "The integration tolerance is invalid."
German = "Die Integrationstoleranz ist ungültig."

[engine.api.error.generic_runtime_error.nintegrate.subdivision_limit_reached]
English = "The maximum number of subdivisions of the integration interval was reached."
German = "Die maximale Anzahl an Unterteilungen des Integrationsintervalls wurde erreicht."

[engine.api.error.generic_runtime_error.nintegrate.roundoff_error]
English = "Roundoff errors prevented the numerical integration from reaching the requested accuracy."
German = "Rundungsfehler haben verhindert, dass die numerische Integration die angeforderte Genauigkeit erreicht."

[engine.api.error.generic_runtime_error.nintegrate.bad_integrand_behavior]
English = "The function behaves irregularly at one or more points within the integration interval."
German = "Die Funktion verhält sich an einer oder mehreren Stellen innerhalb des Integrationsintervalls irregulär."

[engine.api.error.generic_runtime_error.nintegrate.extrapolation_failed]
English = "The extrapolation used for the numerical integration did not converge."
German = "Die für die numerische Integration verwendete Extrapolation ist nicht konvergiert."

[engine.api.error.generic_runtime_error.nintegrate.probably_divergent]
English = "The integral is probably divergent or converges too slowly."
German = "Das Integral ist vermutlich divergent oder konvergiert zu langsam."

[engine.api.error.generic_runtime_error.nintegrate.non_finite_integrand]
English = "The function returned the non-finite value {value} at {x}."
German = "Die Funktion lieferte bei {x} den nicht endlichen Wert {value}."