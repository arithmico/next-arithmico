[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = { workspace = true }
trace = { path = "../trace" }
translate_core = { version = "0.1.0", path = "../translate_core" }
translate = { version = "0.1.0", path = "../translate" }
serde = { workspace = true }
engine_derive = { path = "../engine_derive" }
node = { version = "0.1.0", path = "../node" }
float_utils = { path = "../float_utils" }
math_utils = { path = "../math_utils" }
parser = { version = "0.1.0", path = "../parser" }
node_validator = { version = "0.1.0", path = "../node_validator" }

[dev-dependencies]
lexer = { version = "0.1.0", path = "../lexer", features = ["test_utils"] }

[features]
default = ["datatypes", "operators", "api_modules"]

# feature groups
datatypes = [
    "datatype_number",
    "datatype_symbol",
    "datatype_tensor",
    "datatype_function",
    "datatype_boolean"
]
operators = [
    "operator_negate_number",
    "operator_sum_number_number",
    "operator_sum_vector_vector",
    "operator_sum_matrix_matrix",
    "operator_sum_tensor_tensor",
    "operator_product_number_number",
    "operator_division_number_number",
    "operator_power_number_number",
    "operator_function_call",
    "operator_definition",
    "operator_negate_tensor",
    "operator_product_vector_vector",
    "operator_product_number_tensor",
    "operator_division_tensor_number",
    "operator_product_matrix_matrix",
    "operator_and_boolean_boolean",
    "operator_negate_boolean",
    "operator_or_boolean_boolean",
    "operator_equals_number_number",
    "operator_equals_tensor_tensor",
    "operator_equals_boolean_boolean",
    "operator_less_than_number_number",
    "operator_greater_than_number_number",
    "operator_less_than_or_equals_number_number",
    "operator_greater_than_or_equals_number_number",
    "operator_factorial_number",
]

# data type features
datatype_number = []
datatype_symbol = []
datatype_tensor = []
datatype_function = []
datatype_boolean = []

# operator features
operator_negate_number = ["datatype_number"]
operator_negate_tensor = ["datatype_tensor"]
operator_negate_boolean = ["datatype_boolean"]
operator_sum_number_number = ["datatype_number"]
operator_sum_vector_vector = ["datatype_tensor"]
operator_sum_matrix_matrix = ["datatype_tensor"]
operator_sum_tensor_tensor = ["datatype_tensor"]
operator_product_number_number = ["datatype_number"]
operator_product_number_tensor = ["datatype_number", "datatype_tensor"]
operator_product_vector_vector = ["datatype_tensor"]
operator_division_number_number = ["datatype_number"]
operator_division_tensor_number = ["datatype_tensor", "datatype_number"]
operator_power_number_number = ["datatype_number"]
operator_function_call = [
] # this feature does not depend on "datatype_function" because the call target can be a HostApiEndpoint
operator_definition = ["datatype_symbol"]
operator_product_matrix_matrix = ["datatype_tensor"]
operator_and_boolean_boolean = ["datatype_boolean"]
operator_or_boolean_boolean = ["datatype_boolean"]
operator_equals_number_number = ["datatype_boolean", "datatype_number"]
operator_equals_tensor_tensor = ["datatype_boolean", "datatype_tensor"]
operator_equals_boolean_boolean = ["datatype_boolean"]
operator_less_than_number_number = ["datatype_boolean", "datatype_number"]
operator_greater_than_number_number = ["datatype_boolean", "datatype_number"]
operator_less_than_or_equals_number_number = ["datatype_boolean", "datatype_number"]
operator_greater_than_or_equals_number_number = ["datatype_boolean", "datatype_number"]
operator_factorial_number = ["datatype_number"]

# api modules
api_modules = [
    "api_module_trigonometry",
    "api_module_physics",
    "api_module_distributions",
    "api_module_analysis",
