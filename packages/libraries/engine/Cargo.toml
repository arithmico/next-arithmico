[package]
name = "engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
trace = { path = "../trace" }
translate-core = { version = "0.1.0", path = "../translate-core" }
translate = { version = "0.1.0", path = "../translate" }
serde = { workspace = true }
engine-derive = { path = "../engine-derive" }
node = { version = "0.1.0", path = "../node" }
math-utils = { path = "../math-utils" }
validator = { version = "0.1.0", path = "../validator" }
serializer = { version = "0.1.0", path = "../serializer" }
common = { version = "0.1.0", path = "../common" }
evaluator = { version = "0.1.0", path = "../evaluator", default-features = false }

[dev-dependencies]
lexer = { version = "0.1.0", path = "../lexer", features = ["test_utils"] }

[lints]
workspace = true

[features]
default = ["api_modules", "evaluator/default"]

# api modules
api_modules = [
    "api_module_trigonometry",
    "api_module_physics",
    "api_module_distributions",
    "api_module_analysis",
    "api_module_algebra",
    "api_module_numerical_analysis",
    "api_module_descriptive_statistics",
    "api_module_discrete_mathematics",
]

