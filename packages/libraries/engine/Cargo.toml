[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ast = { path = "../ast" }
thiserror = { workspace = true }

[features]
default = ["ast/default", "api_modules"]

# feature groups
datatypes = ["ast/datatypes"]
operators = ["ast/operators"]

# data type features
datatype_number = ["ast/datatype_number"]
datatype_symbol = ["ast/datatype_symbol"]
datatype_tensor = ["ast/datatype_tensor"]
datatype_function = ["ast/datatype_function"]
datatype_boolean = ["ast/datatype_boolean"]

# operator features
operator_negate_number = ["ast/operator_negate_number"]
operator_negate_tensor = ["ast/operator_negate_tensor"]
operator_negate_boolean = ["ast/operator_negate_boolean"]
operator_sum_number_number = ["ast/operator_sum_number_number"]
operator_sum_vector_vector = ["ast/operator_sum_vector_vector"]
operator_product_number_number = ["ast/operator_product_number_number"]
operator_product_number_tensor = ["ast/operator_product_number_tensor"]
operator_product_vector_vector = ["ast/operator_product_vector_vector"]
operator_division_number_number = ["ast/operator_division_number_number"]
operator_division_tensor_number = ["ast/operator_division_tensor_number"]
operator_power_number_number = ["ast/operator_power_number_number"]
operator_function_call = ["ast/operator_function_call"]
operator_definition = ["ast/operator_definition"]
operator_product_matrix_matrix = ["ast/operator_product_matrix_matrix"]
operator_and_boolean_boolean = ["ast/operator_and_boolean_boolean"]
operator_or_boolean_boolean = ["ast/operator_or_boolean_boolean"]
operator_equals_number_number = ["ast/operator_equals_number_number"]
operator_equals_tensor_tensor = ["ast/operator_equals_tensor_tensor"]
operator_equals_boolean_boolean = ["ast/operator_equals_boolean_boolean"]
operator_less_than_number_number = ["ast/operator_less_than_number_number"]
operator_greater_than_number_number = ["ast/operator_greater_than_number_number"]
operator_less_than_or_equals_number_number = ["ast/operator_less_than_or_equals_number_number"]
operator_greater_than_or_equals_number_number = ["ast/operator_greater_than_or_equals_number_number"]

# api modules
api_modules = ["api_module_trigonometry"]
api_module_trigonometry = [
    "api_endpoint_trigonometry_pi",
    "api_endpoint_trigonometry_sin",
    "api_endpoint_trigonometry_cos"
]

# trigonometry
api_module_loader_trigonometry = []
api_endpoint_trigonometry_pi = ["api_module_loader_trigonometry"]
api_endpoint_trigonometry_sin = ["api_module_loader_trigonometry"]
api_endpoint_trigonometry_cos = ["api_module_loader_trigonometry"]
