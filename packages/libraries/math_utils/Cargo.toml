[package]
name = "math_utils"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
thiserror = { workspace = true }
translate_core = { version = "0.1.0", path = "../translate_core" }
approx = "0.5.1"
num-prime = { version = "0.6.1", default-features = false }
nalgebra = "0.35.0"

# necassary as peer dependency of num-prime
# if num-prime will be updated we can bump getrandom 
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[lints]
workspace = true
