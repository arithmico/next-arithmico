[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
pest = "2.6"
pest_derive = "2.6"
serde = "1.0.202"
thiserror = "1.0"
log = "0.4.21"

[features]
default = ["group_trigonometry"]

# feature groups
group_trigonometry = [
    "api_endpoint_trigonometry_pi",
    "api_endpoint_trigonometry_sin",
]

# host api module features
api_module_trigonometry = []

# host api endpoint features
api_endpoint_trigonometry_pi = ["api_module_trigonometry"]
api_endpoint_trigonometry_sin = ["api_module_trigonometry"]
