[package]
name = "config-service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
lambda_http = "1.3.2"
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

[lints]
workspace = true
