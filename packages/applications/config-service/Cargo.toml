[package]
name = "config-service"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1.135.0"
aws-sdk-secretsmanager = "1.124.0"
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
clap = { workspace = true, feature = "derive" }
derive_builder = "0.20.2"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
lambda_http = "1.3.2"
octocrab = "0.54.9"
semver = "1.0.28"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
thiserror.workspace = true
serde_json = "1.0.154"

[lints]
workspace = true
