[package]
name = "arithmico"
version = "0.1.0"
edition = "2021"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { workspace = true }
leptos_router = { version = "0.6.12", features = ["csr"] }
engine = { path = "../../libraries/engine" }
common = { path = "../../libraries/common" }
common_ui = { version = "0.1.0", path = "../../libraries/common_ui" }
serde = { version = "1.0.210", features = ["derive"] }
gloo-storage = "0.3.0"
serde_json = "1.0.128"
web-sys = { version = "0.3.72", features = [
    "InputEvent",
    "DataTransfer",
    "HtmlDivElement",
    "Document",
    "Selection",
    "Range",
    "Node",
    "NodeList"
] }
js-sys = "0.3.72"
editor = { path = "../../libraries/editor" }
trace = { version = "0.1.0", path = "../../libraries/trace" }
editor_core = { version = "0.1.0", path = "../../libraries/editor_core" }
