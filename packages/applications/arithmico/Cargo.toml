[package]
name = "arithmico"
version = "0.1.0"
edition = "2021"

[dependencies]
yew = { version = "0.21.0", features = ["csr"] }
yew-router = "0.18.0"
wasm-bindgen = "0.2.92"
web-sys = "0.3.69"
log = "0.4.21"
wasm-logger = "0.2.0"

# internal dependencies
engine = { path = "../../libraries/engine", default-features = false }
headless_components = { path = "../../libraries/headless_components" }
icons = { path = "../../libraries/icons" }
serde = "1.0.202"
serde_json = "1.0.117"


[features]
default = ["engine/default"]
