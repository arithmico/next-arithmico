[package]
name = "arithmico"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { workspace = true }
leptos_router = { version = "0.7.1" }
engine = { path = "../../libraries/engine" }
common = { path = "../../libraries/common" }
ui = { version = "0.1.0", path = "../../libraries/ui" }
serde = { version = "1.0.210", features = ["derive"] }
gloo-storage = "0.3.0"
serde_json = "1.0.128"
web-sys = { version = "0.3.72", features = [
    "InputEvent",
    "DataTransfer",
    "HtmlDivElement",
    "Document",
    "Selection",
    "Range",
    "Node",
    "NodeList"
] }
js-sys = "0.3.72"
editor = { path = "../../libraries/editor" }
trace = { path = "../../libraries/trace" }
editor_core = { path = "../../libraries/editor_core" }
translate = { path = "../../libraries/translate" }
web_state = { path = "../../libraries/web_state" }
toml = "0.8.20"
