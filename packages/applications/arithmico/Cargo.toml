[package]
name = "arithmico"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { workspace = true }
leptos_router = { version = "0.8.11" }
engine = { path = "../../libraries/engine" }
ui = { version = "0.1.0", path = "../../libraries/ui" }
serde = { workspace = true }
gloo-storage = "0.3.0"
serde_json = "1.0.148"
web-sys = { version = "0.3.72", features = [
    "InputEvent",
    "DataTransfer",
    "HtmlDivElement",
    "Document",
    "Selection",
    "Range",
    "Node",
    "NodeList",
    "Window",
    "MediaQueryList",
    "MediaQueryListEvent"
] }
js-sys = "0.3.72"
editor = { path = "../../libraries/editor" }
trace = { path = "../../libraries/trace" }
editor_core = { path = "../../libraries/editor_core" }
translate = { path = "../../libraries/translate" }
web_state = { path = "../../libraries/web_state" }
toml = "0.9.10"
chrono = "0.4.42"
wasm-bindgen = "0.2.106"

[build-dependencies]
chrono = "0.4.42"
