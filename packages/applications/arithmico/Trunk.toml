[watch]
watch = ["../../"]
ignore = [
    "**/index.css",
    "./dist",
    "../arithmico-e2e",
    "../../target"
]

[build]
target = "index.html"
dist = "dist"
minify = "on_release"

[[hooks]]
stage = "pre_build"
command = "./trunk_hooks/pre_build.sh"

[[hooks]]
stage = "post_build"
command = "./trunk_hooks/post_build.sh"
