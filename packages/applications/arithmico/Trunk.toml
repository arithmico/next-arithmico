[watch]
watch = ["../../"]
ignore = [
    "**/index.css",
    "./dist",
    "../arithmico-e2e",
    "../../target"
]

[build]
target = "index.html"
dist = "dist"
minify = "on_release"

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
    "-c", 
    'find ../../.. -type f -name "*.css" ! -path "*/dist/*" ! -name "index.css" ! -path "*/node_modules/*" -exec cat {} + > index.css'
]
