[watch]
watch = ["../../"]
ignore = ["./index.css"]

[build]
target = "index.html"
dist = "dist"
minify = "on_release"

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", 'cssbundler -i "./**/*.css","../../libraries/ui/**/*.css","../../libraries/editor/**/*.css","../../../styles/**/*.css" -o index.css -e "$TRUNK_DIST_DIR/**/*.css"']
