[package]
name = "engine-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { version = "0.1.0", path = "../../libraries/common" }
console_error_panic_hook.workspace = true
engine = { version = "0.1.0", path = "../../libraries/engine", default-features = false }
engine-protocol = { version = "0.1.0", path = "../../libraries/engine-protocol" }
evaluator = { version = "0.1.0", path = "../../libraries/evaluator", default-features = false }
node = { version = "0.1.0", path = "../../libraries/node" }
parser = { version = "0.1.0", path = "../../libraries/parser" }
serde_json = "1.0.153"
web-sys = { version = "0.3.106", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "console"] }

[lints]
workspace = true

