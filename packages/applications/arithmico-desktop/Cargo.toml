[package]
name = "arithmico-desktop"
version = "0.1.0"
description = "An accessible scientific calculator for visually impaired and blind students."
authors = ["Lennard Behrens"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
