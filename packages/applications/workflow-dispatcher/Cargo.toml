[package]
name = "workflow-dispatcher"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "1.0.1"
serde = "1"
tokio = { version = "1", features = ["macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
clap = { workspace = true, feature = "derive" }
