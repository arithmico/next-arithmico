[package]
name = "workflow-dispatcher"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_runtime = "1.0.1"
serde.workspace = true
tokio = { workspace = true, features = ["macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
clap = { workspace = true, features = ["derive", "env"] }
workflow-dispatcher-protocol = { version = "0.1.0", path = "../../libraries/workflow-dispatcher-protocol" }
github-app-auth = { version = "0.1.0", path = "../../libraries/github-app-auth" }
database = { version = "0.1.0", path = "../../libraries/database" }
aws-sdk-sqs.workspace = true
anyhow.workspace = true
aws-config = { workspace = true, features = ["behavior-version-latest"] }
