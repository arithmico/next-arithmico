[package]
name = "api-handler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
aws-config = { workspace = true, features = ["behavior-version-latest"] }
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
clap = { workspace = true, features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
lambda_http = "1.3.2"
octocrab.workspace = true
semver.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
thiserror.workspace = true
serde_json.workspace = true
workflow-dispatcher-protocol = { version = "0.1.0", path = "../../libraries/workflow-dispatcher-protocol" }
aws-sdk-sqs.workspace = true
database = { version = "0.1.0", path = "../../libraries/database" }
github-app-auth = { version = "0.1.0", path = "../../libraries/github-app-auth" }

[lints]
workspace = true
