[package]
name = "api-handler"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-config = { version = "1.13.0", features = ["behavior-version-latest"] }
aws-sdk-secretsmanager = "1.124.0"
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio"] }
clap = { workspace = true, features = ["derive", "env"] }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
lambda_http = "1.3.2"
octocrab = "0.54.9"
semver.workspace = true
reqwest = { version = "0.13.5", features = ["json"] }
serde = { workspace = true, features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
thiserror.workspace = true
serde_json = "1.0.154"
workflow-dispatcher-protocol = { version = "0.1.0", path = "../../libraries/workflow-dispatcher-protocol" }
aws-sdk-sqs = "1.120.0"
database = { version = "0.1.0", path = "../../libraries/database" }

[lints]
workspace = true
